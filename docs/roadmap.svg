<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">比格钱钱项目路线图</title>
  <desc id="desc">三步路线：收齐旧账、理清罪状、串起故事。</desc>
  <defs>
    <linearGradient id="step1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9753f"/>
      <stop offset="1" stop-color="#bd542f"/>
    </linearGradient>
    <linearGradient id="step2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c9175"/>
      <stop offset="1" stop-color="#33735b"/>
    </linearGradient>
    <linearGradient id="step3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7184ad"/>
      <stop offset="1" stop-color="#536790"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d352f" flood-opacity=".14"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .step { font-size: 14px; font-weight: 700; letter-spacing: 2.2px; fill: #fff; opacity: .82; }
      .label { font-size: 34px; font-weight: 800; letter-spacing: 1px; fill: #fff; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="28" fill="#f7f3ed"/>
  <circle cx="1090" cy="42" r="90" fill="#f1dfcf" opacity=".55"/>
  <circle cx="86" cy="270" r="70" fill="#e8edf6" opacity=".7"/>

  <g filter="url(#shadow)">
    <rect x="40" y="48" width="340" height="204" rx="24" fill="url(#step1)"/>
    <rect x="430" y="48" width="340" height="204" rx="24" fill="url(#step2)"/>
    <rect x="820" y="48" width="340" height="204" rx="24" fill="url(#step3)"/>
  </g>

  <text x="82" y="104" class="sans step">STEP 1</text>
  <text x="82" y="162" class="sans label">收齐旧账</text>

  <text x="472" y="104" class="sans step">STEP 2</text>
  <text x="472" y="162" class="sans label">理清罪状</text>

  <text x="862" y="104" class="sans step">STEP 3</text>
  <text x="862" y="162" class="sans label">串起故事</text>

  <g fill="none" stroke="#91877f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".65">
    <path d="M386 150h34"/>
    <path d="M411 140l11 10-11 10"/>
    <path d="M776 150h34"/>
    <path d="M801 140l11 10-11 10"/>
  </g>
</svg>
