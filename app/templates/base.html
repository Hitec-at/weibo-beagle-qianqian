<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}比格钱钱 微博检索{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">比格钱钱 · 微博检索</a>
    <nav class="nav">
      <a href="/">热门</a>
      <a href="/memes">N宗罪</a>
      <a href="/interactions">互动</a>
      <a href="/photos">高清图</a>
    </nav>
    <form class="search" action="/search" method="get">
      <input type="text" name="q" placeholder="搜索微博" value="{{ request.query_params.get('q', '') }}">
      <button type="submit">搜索</button>
    </form>
  </header>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    <p>本站仅对 @比格钱钱 的公开微博做引用索引：短引文 + 缩略图预览 + 跳转原微博，版权归原作者所有。如涉侵权请告知，立即删除。</p>
  </footer>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" hidden>
    <button class="lightbox-close" id="lightbox-close" type="button" aria-label="关闭图片预览">关闭</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" type="button" aria-label="上一张图片">‹</button>
    <figure>
      <img id="lightbox-image" alt="">
      <figcaption>
        <a id="lightbox-original" href="#" target="_blank" rel="noopener">查看原微博 ↗</a>
        <span id="lightbox-count" aria-live="polite"></span>
      </figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" type="button" aria-label="下一张图片">›</button>
  </div>
  <script>
    document.addEventListener("play", function (event) {
      if (event.target && event.target.tagName === "VIDEO") {
        event.target.dataset.userPlayed = "1";
      }
    }, true);
    document.addEventListener("error", function (event) {
      const video = event.target && event.target.closest ? event.target.closest("video") : null;
      if (!video) return;
      const retries = Number(video.dataset.retry || 0);
      if (retries >= 2) return;
      const source = video.querySelector("source");
      const base = source ? source.getAttribute("src") : video.getAttribute("src");
      if (!base) return;
      video.dataset.retry = String(retries + 1);
      const next = base.split("&retry=")[0] + (base.includes("?") ? "&" : "?") + "retry=" + Date.now();
      if (source) source.src = next;
      else video.src = next;
      video.load();
      if (video.dataset.userPlayed === "1") {
        video.play().catch(function () {});
      }
    }, true);

    (function () {
      const lightbox = document.getElementById("lightbox");
      if (!lightbox) return;
      const image = document.getElementById("lightbox-image");
      const original = document.getElementById("lightbox-original");
      const count = document.getElementById("lightbox-count");
      const closeButton = document.getElementById("lightbox-close");
      const prevButton = document.getElementById("lightbox-prev");
      const nextButton = document.getElementById("lightbox-next");
      let items = [];
      let current = 0;
      let activeTrigger = null;

      function render() {
        const item = items[current];
        if (!item) return;
        image.src = item.dataset.lightboxSrc;
        image.alt = item.dataset.lightboxAlt || "微博配图";
        original.href = item.dataset.lightboxOriginal || "#";
        count.textContent = (current + 1) + " / " + items.length;
        const multiple = items.length > 1;
        prevButton.hidden = !multiple;
        nextButton.hidden = !multiple;
      }

      function open(trigger) {
        const group = trigger.dataset.lightboxGroup || "page";
        items = Array.from(document.querySelectorAll("[data-lightbox-src]")).filter(function (item) {
          return (item.dataset.lightboxGroup || "page") === group && item.dataset.lightboxSrc;
        });
        current = Math.max(0, items.indexOf(trigger));
        if (!items.length) return;
        activeTrigger = trigger;
        document.body.classList.add("lightbox-open");
        lightbox.hidden = false;
        render();
        closeButton.focus();
      }

      function close() {
        lightbox.hidden = true;
        document.body.classList.remove("lightbox-open");
        image.removeAttribute("src");
        if (activeTrigger) activeTrigger.focus();
        activeTrigger = null;
      }

      function move(step) {
        if (items.length < 2) return;
        current = (current + step + items.length) % items.length;
        render();
      }

      document.addEventListener("click", function (event) {
        const trigger = event.target.closest ? event.target.closest("[data-lightbox-src]") : null;
        if (!trigger || lightbox.contains(trigger)) return;
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        open(trigger);
      });

      document.addEventListener("keydown", function (event) {
        const trigger = event.target.closest ? event.target.closest("[data-lightbox-src]") : null;
        if (trigger && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          open(trigger);
          return;
        }
        if (lightbox.hidden) return;
        if (event.key === "Escape") close();
        else if (event.key === "ArrowLeft") move(-1);
        else if (event.key === "ArrowRight") move(1);
      });

      closeButton.addEventListener("click", close);
      prevButton.addEventListener("click", function () { move(-1); });
      nextButton.addEventListener("click", function () { move(1); });
      lightbox.addEventListener("click", function (event) {
        if (event.target === lightbox) close();
      });
    })();
  </script>
</body>
</html>
